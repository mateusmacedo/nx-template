name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release type (affects docker versioning)'
        type: choice
        options:
          - production
          - hotfix
        default: production

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    name: Release
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        (
          startsWith(github.event.pull_request.head.ref, 'release/') ||
          startsWith(github.event.pull_request.head.ref, 'hotfix/')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate manual dispatch branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "::error::Manual release is allowed only from main. Current ref: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mateusmacedo'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve docker version scheme
        id: docker-scheme
        run: |
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          MANUAL_TYPE="${{ inputs.release-type }}"
          if [[ "$HEAD_REF" == hotfix/* ]] || [[ "$MANUAL_TYPE" == "hotfix" ]]; then
            echo "value=hotfix" >> $GITHUB_OUTPUT
          else
            echo "value=production" >> $GITHUB_OUTPUT
          fi

      - name: Release
        id: release
        continue-on-error: true
        run: pnpm nx release --yes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: false

      - name: Check Release Result
        if: steps.release.outcome == 'failure'
        run: |
          echo "::warning::Release completed with warnings - may be expected if no changes were detected"

      - name: Detect docker release candidates
        id: docker-candidates
        run: |
          APPS_JSON=$(pnpm nx show projects --projects="tag:type:app" --json)
          APPS_COUNT=$(node -e "const projects = JSON.parse(process.argv[1] ?? '[]'); console.log(Array.isArray(projects) ? projects.length : 0);" "$APPS_JSON")
          APPS_CSV=$(node -e "const projects = JSON.parse(process.argv[1] ?? '[]'); console.log(Array.isArray(projects) ? projects.join(',') : '');" "$APPS_JSON")

          if [[ "$APPS_COUNT" -gt 0 ]]; then
            echo "has_docker_apps=true" >> "$GITHUB_OUTPUT"
            echo "projects_csv=$APPS_CSV" >> "$GITHUB_OUTPUT"
            echo "Docker release enabled for projects: $APPS_CSV"
          else
            echo "has_docker_apps=false" >> "$GITHUB_OUTPUT"
            echo "projects_csv=" >> "$GITHUB_OUTPUT"
            echo "No docker release candidates found for tag:type:app. Skipping Docker steps."
          fi

      - name: Log in to GitHub Container Registry
        if: steps.docker-candidates.outputs.has_docker_apps == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release — docker apps
        if: steps.docker-candidates.outputs.has_docker_apps == 'true'
        run: pnpm nx release --projects="${{ steps.docker-candidates.outputs.projects_csv }}" --dockerVersionScheme=${{ steps.docker-scheme.outputs.value }} --yes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
